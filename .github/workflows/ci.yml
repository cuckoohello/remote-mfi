name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test, race, vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Install libusb headers
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"

      - name: Download modules
        run: go mod download

      - name: Unit tests
        run: go test -coverprofile=coverage.out ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          CGO_ENABLED=1 go build -trimpath \
            -ldflags="-s -w \
              -X github.com/cuckoohello/remote-mfi/internal/ver.Version=ci \
              -X github.com/cuckoohello/remote-mfi/internal/ver.Commit=${GITHUB_SHA} \
              -X github.com/cuckoohello/remote-mfi/internal/ver.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o remote-mfi ./cmd/remote-mfi
          ./remote-mfi --version

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  docker:
    name: Docker build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

  host-glibc:
    name: Host glibc build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Install libusb headers
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Build dynamically linked glibc binary
        run: |
          CGO_ENABLED=1 go build -trimpath \
            -ldflags="-s -w \
              -X github.com/cuckoohello/remote-mfi/internal/ver.Version=ci \
              -X github.com/cuckoohello/remote-mfi/internal/ver.Commit=${GITHUB_SHA} \
              -X github.com/cuckoohello/remote-mfi/internal/ver.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o remote-mfi ./cmd/remote-mfi
          file remote-mfi
          ldd remote-mfi | grep -F libusb-1.0.so.0
