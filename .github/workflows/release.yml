name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker-build:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Publish Docker manifest
    needs: docker-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          sources=()
          for digest in *; do
            sources+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${image}:${{ github.ref_name }}" \
            -t "${image}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${image}:${{ github.ref_name }}"

  host-binaries:
    name: Host binary (${{ matrix.arch }}/${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            libc: glibc
            runner: ubuntu-22.04
          - arch: arm64
            libc: glibc
            runner: ubuntu-22.04-arm
          - arch: amd64
            libc: musl
            runner: ubuntu-22.04
            image: golang:1.23-alpine3.20
          - arch: arm64
            libc: musl
            runner: ubuntu-22.04-arm
            image: golang:1.23-alpine3.20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: matrix.libc == 'glibc'
        with:
          go-version: "1.23.x"
          cache: true

      - name: Build glibc binary natively
        if: matrix.libc == 'glibc'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_LIBC: ${{ matrix.libc }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUTPUT_DIR="dist/linux_${TARGET_ARCH}_${TARGET_LIBC}"
          mkdir -p "${OUTPUT_DIR}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config
          CGO_ENABLED=1 go build -trimpath \
            -ldflags="-s -w \
              -X github.com/cuckoohello/remote-mfi/internal/ver.Version=${VERSION} \
              -X github.com/cuckoohello/remote-mfi/internal/ver.Commit=${COMMIT} \
              -X github.com/cuckoohello/remote-mfi/internal/ver.BuildDate=${BUILD_DATE}" \
            -o "${OUTPUT_DIR}/remote-mfi" ./cmd/remote-mfi

      - name: Build musl binary natively
        if: matrix.libc == 'musl'
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_LIBC: ${{ matrix.libc }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUTPUT_DIR="dist/linux_${TARGET_ARCH}_${TARGET_LIBC}"
          mkdir -p "${OUTPUT_DIR}"
          docker run --rm \
            -e VERSION -e COMMIT -e BUILD_DATE \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            "${BUILD_IMAGE}" \
            sh -ec "apk add --no-cache build-base libusb-dev=1.0.27-r0 pkgconfig; \
              CGO_ENABLED=1 go build -trimpath \
              -ldflags='-s -w \
                -X github.com/cuckoohello/remote-mfi/internal/ver.Version=${VERSION} \
                -X github.com/cuckoohello/remote-mfi/internal/ver.Commit=${COMMIT} \
                -X github.com/cuckoohello/remote-mfi/internal/ver.BuildDate=${BUILD_DATE}' \
              -o /src/${OUTPUT_DIR}/remote-mfi ./cmd/remote-mfi"

      - name: Package binary
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_LIBC: ${{ matrix.libc }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="dist/linux_${TARGET_ARCH}_${TARGET_LIBC}"
          cp README.md README.zh-CN.md LICENSE "${OUTPUT_DIR}/"
          ARCHIVE="remote-mfi_${VERSION}_linux_${TARGET_ARCH}_${TARGET_LIBC}.tar.gz"
          tar -C "${OUTPUT_DIR}" -czf "dist/${ARCHIVE}" remote-mfi README.md README.zh-CN.md LICENSE
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.arch }}-${{ matrix.libc }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [docker-merge, host-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: host-*
          path: release
          merge-multiple: true

      - name: Verify release files
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find release -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          (cd release && sha256sum -c *.sha256)

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
          body: |
            Docker image:

            ```sh
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Platforms: `linux/amd64`, `linux/arm64`.

            Host binaries are dynamically linked against libusb and are provided for glibc and musl.
