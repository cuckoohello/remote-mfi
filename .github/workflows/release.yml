name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Publish Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  host-binaries:
    name: Host binary (${{ matrix.arch }}/${{ matrix.libc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            libc: glibc
            image: golang:1.23-bullseye
          - arch: arm64
            platform: linux/arm64
            libc: glibc
            image: golang:1.23-bullseye
          - arch: amd64
            platform: linux/amd64
            libc: musl
            image: golang:1.23-alpine3.20
          - arch: arm64
            platform: linux/arm64
            libc: musl
            image: golang:1.23-alpine3.20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - name: Build dynamically linked binary
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          BUILD_IMAGE: ${{ matrix.image }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_LIBC: ${{ matrix.libc }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUTPUT_DIR="dist/linux_${TARGET_ARCH}_${TARGET_LIBC}"
          mkdir -p "${OUTPUT_DIR}"

          if [ "${TARGET_LIBC}" = "glibc" ]; then
            INSTALL='apt-get update && apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config'
            SHELL_BIN='bash'
          else
            INSTALL='apk add --no-cache build-base libusb-dev=1.0.27-r0 pkgconfig'
            SHELL_BIN='sh'
          fi

          docker run --rm \
            --platform="${TARGET_PLATFORM}" \
            -e VERSION -e COMMIT -e BUILD_DATE \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            "${BUILD_IMAGE}" \
            "${SHELL_BIN}" -ec "${INSTALL}; \
              CGO_ENABLED=1 go build -trimpath \
              -ldflags='-s -w \
                -X github.com/cuckoohello/remote-mfi/internal/ver.Version=${VERSION} \
                -X github.com/cuckoohello/remote-mfi/internal/ver.Commit=${COMMIT} \
                -X github.com/cuckoohello/remote-mfi/internal/ver.BuildDate=${BUILD_DATE}' \
              -o /src/${OUTPUT_DIR}/remote-mfi ./cmd/remote-mfi"

          cp README.md LICENSE "${OUTPUT_DIR}/"
          ARCHIVE="remote-mfi_${VERSION}_linux_${TARGET_ARCH}_${TARGET_LIBC}.tar.gz"
          tar -C "${OUTPUT_DIR}" -czf "dist/${ARCHIVE}" remote-mfi README.md LICENSE
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.arch }}-${{ matrix.libc }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [docker, host-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: host-*
          path: release
          merge-multiple: true

      - name: Verify release files
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find release -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          (cd release && sha256sum -c *.sha256)

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
          body: |
            Docker image:

            ```sh
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Platforms: `linux/amd64`, `linux/arm64`.

            Host binaries are dynamically linked against libusb and are provided for glibc and musl.
